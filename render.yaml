services:
  - type: web
    name: deepverif-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY      # optional: turns on the "AI se samjhao" button
        sync: false
      - key: ANTHROPIC_MODEL        # optional, default claude-haiku-5-5
        sync: false
      - key: NUMBER_SALT            # set any long random string
        sync: false
